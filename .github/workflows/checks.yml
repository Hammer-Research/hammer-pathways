name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the built wheel, not an editable checkout
        run: python -m pip install dist/*.whl 'pytest>=7.4,<10'
      - run: python -m pytest tests -q
      - run: python examples/minimal.py
      - name: Check standalone imports
        run: python -c "import sys; import hammer_pathways; assert not any(m in sys.modules for m in ('gene_rank', 'ingest', 'sklearn', 'torch', 'pandas'))"
